<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI足球数据分析</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
  background:#f4f7fb;
  color:#13243b;
}
.hero{
  padding:32px 22px 68px;
  background:linear-gradient(135deg,#083d7f,#087df0);
  color:white;
}
.hero h1{font-size:30px;margin:10px 0}
.wrap{
  max-width:700px;
  margin:-38px auto 70px;
  padding:0 15px;
}
.card{
  background:white;
  border-radius:22px;
  padding:22px;
  margin:14px 0;
  box-shadow:0 8px 28px rgba(23,54,91,.10);
}
.tag{
  display:inline-block;
  background:#eaf4ff;
  color:#1268b8;
  padding:6px 11px;
  border-radius:20px;
  font-size:13px;
  font-weight:700;
}
.vip{background:#fff3d3;color:#946100}
.admin{background:#e9f8ef;color:#197346}
h2{font-size:25px;margin:16px 0}
input{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:1px solid #dce4ed;
  border-radius:13px;
  font-size:16px;
}
button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:13px;
  background:#126ed7;
  color:white;
  font-size:16px;
  font-weight:700;
}
.alt{background:#eaf3ff;color:#1264aa}
.match{
  border:1px solid #e2e8ef;
  border-radius:16px;
  padding:16px;
  margin-top:13px;
}
.small{
  font-size:13px;
  color:#778397;
  line-height:1.7;
}
.status{
  padding:12px;
  border-radius:12px;
  margin-top:12px;
  font-size:14px;
  display:none;
}
.success{
  display:block;
  background:#eaf8ef;
  color:#237844;
}
.error{
  display:block;
  background:#fff0f0;
  color:#b12c2c;
}
.hide{display:none}
.userbox{
  background:#f5f9ff;
  border-radius:14px;
  padding:14px;
  margin:14px 0;
}
.debug{
  background:#fff6e5;
  color:#8b5b00;
  border-radius:12px;
  padding:12px;
  margin-top:12px;
  font-size:12px;
  line-height:1.6;
  display:none;
  word-break:break-all;
}
.bottom{
  text-align:center;
  font-size:12px;
  color:#8a96a6;
  padding:15px;
}
</style>
</head>

<body>

<div class="hero">
  <small>AI FOOTBALL DATA LAB · ONLINE</small>
  <h1>AI足球数据分析</h1>
  <div>比赛研究 · 数据分析 · 会员报告</div>
</div>

<div class="wrap">

<div id="authPage" class="card">
  <span class="tag">会员系统</span>
  <h2 id="authTitle">会员登录</h2>

  <input id="email" type="email"
         placeholder="请输入邮箱"
         autocomplete="email">

  <input id="password" type="password"
         placeholder="请输入密码（至少6位）"
         autocomplete="current-password">

  <button id="mainBtn" onclick="handleAuth()">登录</button>

  <button class="alt" onclick="switchMode()">
    <span id="switchText">没有账号？注册账号</span>
  </button>

  <div id="message" class="status"></div>

  <p class="small">
    账号数据已连接云端。测试阶段暂时使用邮箱注册登录。
  </p>
</div>


<div id="memberPage" class="hide">

  <div id="adminCard" class="card hide">
    <span class="tag admin">ADMIN</span>
    <h2>管理员
